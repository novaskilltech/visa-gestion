<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="check" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Squircle Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)" />

  <!-- Subtle Inner Border -->
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.25" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Stylized Shield & V -->
  <!-- Left wing of V -->
  <path d="M6 8 L13 22 L15.5 22 L10 8 Z" fill="#60a5fa" />

  <!-- Right wing of V evolving into an ascending checkmark/flight -->
  <path d="M12.5 22 L14.5 22 L24 9 L21.5 8 L14 18.5 Z" fill="url(#gold)" />

  <!-- Golden / Emerald visa checkmark accent -->
  <path d="M17 14 L24.5 6.5 L26 8 L17 17 Z" fill="url(#check)" />

  <!-- Central star / spark dot -->
  <circle cx="24.5" cy="7.25" r="1.5" fill="#fef08a" />
</svg>
